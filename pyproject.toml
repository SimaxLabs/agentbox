[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbox-workbench"
version = "0.2.0"
description = "A local-first catalog for backing up and restoring AI coding-agent resources."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
]

[project.scripts]
agentbox = "agentbox.cli:entrypoint"
agentbox-ui = "agentbox.web_cli:entrypoint"

[tool.setuptools]
packages = ["agentbox"]

[tool.setuptools.package-data]
agentbox = [
  "default_config.json",
  "providers.json",
  "templates/*.html",
  "templates/partials/*.html",
  "static/*.css",
  "static/*.js",
  "static/*.png",
  "static/*.webmanifest",
  "static/vendor/*.js",
  "static/vendor/*.md",
  "static/vendor/*.txt",
]
